# ── treedetect configuration ───────────────────────────────────────────────
# INPUT data is NOT stored in the repo. It is resolved under a data root, in order:
#   env SOFLO_DATA_ROOT  >  `data_root` below  >  error (see .env.example).
# OUTPUT paths (outputs_dir / reports_dir, near the bottom) stay repo-relative.

# Optional fallback for the data root. Prefer SOFLO_DATA_ROOT (in .env). Leave
# empty to require the env var; or set an absolute path, e.g. /path/to/soflo_data
data_root:

inputs:                          # paths are relative to the data root (above)
  orthomosaic:   umgables_2025_drone_survey_5cm.tif     # drone RGB ortho, 5 cm/px, EPSG:32617
  points:        um_gables_trees.geojson                # botanical inventory (ground truth)
  segmentation:  um_gables_tree_segmentation.geojson    # prior-model crown polygons (reference)
  detection:     um_gables_tree_detection.geojson       # prior-model boxes (reference only)
  metadata:      "GDSC_metadata(Metadata).csv"          # GDSC tile metadata catalog

crs: "EPSG:32617"            # UTM 17N — everything is already in this, in metres

labels:
  tree_flag_field: point_is_tree   # keep only rows where this == "Yes"
  tree_flag_value: "Yes"
  species_field:   tax_genus_species
  fallback_box_m:  null            # null = auto (median clean-crown size); or set e.g. 6.9

# Area-of-interest split. Two ways to define each AOI:
#   bbox_fraction: [fx, fy] carves a corner of the data bounding box, OR
#   bounds: [minx, miny, maxx, maxy] in CRS units (read these off QGIS for precision).
aois:
  train:                       # bottom-left in the Gables ortho
    corner: bottom_left
    bbox_fraction: [0.42, 0.42]
    bounds: null
  test:                        # top-right
    corner: top_right
    bbox_fraction: [0.42, 0.42]
    bounds: null

tiles:
  patch_size_m: 40.0           # tile footprint on the ground; pixels computed from GSD
  patch_overlap: 0.10          # fractional overlap between adjacent tiles
  min_boxes_per_tile: 1        # drop empty tiles

train:
  epochs: 50                   # max epochs; early stopping usually halts sooner
  batch_size: 2                # conservative for 18 GB unified memory (MPS); bump if it fits
  score_thresh: 0.30           # confidence cutoff at inference
  iou_eval: 0.4                # IoU threshold for matching in evaluation
  early_stop_patience: 8       # stop after N epochs with no val-recall improvement
  val_accuracy_interval: 1     # compute val precision/recall every epoch (needed for early stop)

outputs_dir: outputs
reports_dir: reports
